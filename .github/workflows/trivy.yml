# Trivy Security Scanning — BariatricPath
# Scans Docker container images for OS-level CVEs and
# scans the repository filesystem for hardcoded secrets

# AI-USAGE SUMMARY
# Tools: Claude, ChatGPT
# Overall AI Contribution: ~40%
# AI-Assisted Areas: workflow structure, image build steps, severity config
# Human Contributions: Dockerfile paths, env var handling, stack decisions
# Notes: scans backend, frontend, and AI service containers separately

name: Trivy Container and Secret Scanning

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  # Weekly scan — catches new CVEs even when code hasn't changed
  # A vulnerability disclosed today affects yesterday's image
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:

  # ── SECRET SCANNING ───────────────────────────────────────────
  
  secret-scan:
    name: Secret Detection (Filesystem)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          # exit-code 0 means: report findings but do not fail the pipeline
          # Change to '1' when you want to enforce no secrets in repo
          exit-code: '0'

      - name: Post secret scan summary
        if: always()
        run: |
          echo "## Secret Detection Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trivy scanned the repository for hardcoded secrets:" >> $GITHUB_STEP_SUMMARY
          echo "- API keys and tokens" >> $GITHUB_STEP_SUMMARY
          echo "- Database connection strings with credentials" >> $GITHUB_STEP_SUMMARY
          echo "- Private keys accidentally committed" >> $GITHUB_STEP_SUMMARY
          echo "- Firebase service account credentials" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check logs above for any findings." >> $GITHUB_STEP_SUMMARY

  # ── BACKEND CONTAINER SCAN ────────────────────────────────────
  scan-backend:
    name: Scan Backend Container (Express/Node)
    runs-on: ubuntu-latest
    # Run after secret scan passes
    needs: secret-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Create a minimal .env so the Docker build does not fail
      # These are fake values — no real services are called during build
      - name: Create temp env for build
        run: |
          echo "PORT=5001" > server/.env
          echo "DATABASE_URL=postgresql://fake:fake@localhost:5432/fake" >> server/.env
          echo "FIREBASE_PROJECT_ID=fake-project" >> server/.env
          echo "FIREBASE_CLIENT_EMAIL=fake@fake.com" >> server/.env
          echo 'FIREBASE_PRIVATE_KEY=fake-key' >> server/.env
          echo "NODE_ENV=test" >> server/.env

      # Build the actual Docker image defined in server/Dockerfile
      - name: Build backend Docker image
        run: docker build -t bariatricpath-backend:scan ./server

    
      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bariatricpath-backend:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          # Ignore unfixed CVEs — these are known issues with no patch yet
          # Nothing you can do about them until the upstream fixes them
          ignore-unfixed: true

      - name: Post backend scan summary
        if: always()
        run: |
          echo "##  Backend Container Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trivy scanned the Express/Node Docker image for:" >> $GITHUB_STEP_SUMMARY
          echo "- OS package vulnerabilities (Ubuntu base image)" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js runtime CVEs" >> $GITHUB_STEP_SUMMARY
          echo "- Installed npm package vulnerabilities inside the container" >> $GITHUB_STEP_SUMMARY

  # ── FRONTEND CONTAINER SCAN ───────────────────────────────────
  scan-frontend:
    name: Scan Frontend Container (React/Vite)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create temp env for build
        run: |
          echo "VITE_API_URL=http://localhost:5001/api" > client/.env

      - name: Build frontend Docker image
        run: docker build -t bariatricpath-frontend:scan ./client

      - name: Run Trivy on frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bariatricpath-frontend:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Post frontend scan summary
        if: always()
        run: |
          echo "##  Frontend Container Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trivy scanned the React/Vite Docker image for:" >> $GITHUB_STEP_SUMMARY
          echo "- OS package vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js runtime CVEs" >> $GITHUB_STEP_SUMMARY

  # ── AI SERVICE CONTAINER SCAN ─────────────────────────────────
  scan-ai-service:
    name: Scan AI Service Container (Python/FastAPI)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create temp env for build
        run: |
          echo "OPENAI_API_KEY=fake-key-for-scan" > ai-service/.env

      - name: Build AI service Docker image
        run: docker build -t bariatricpath-ai:scan ./ai-service

      - name: Run Trivy on AI service image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bariatricpath-ai:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Post AI service scan summary
        if: always()
        run: |
          echo "##  AI Service Container Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trivy scanned the Python/FastAPI Docker image for:" >> $GITHUB_STEP_SUMMARY
          echo "- OS package vulnerabilities (Python slim base)" >> $GITHUB_STEP_SUMMARY
          echo "- Python runtime CVEs" >> $GITHUB_STEP_SUMMARY
          echo "- pip package vulnerabilities (LangChain, ChromaDB, FastAPI)" >> $GITHUB_STEP_SUMMARY

  # ── DOCKERFILE CONFIG SCAN ────────────────────────────────────
  # Checks Dockerfiles for misconfigurations — running as root,
  # missing health checks, exposing unnecessary ports, etc.
  # Teaching point: a correctly written app in a misconfigured
  # container is still a security risk
  scan-dockerfile-config:
    name: Dockerfile Misconfiguration Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan server Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'server/Dockerfile'
          format: 'table'
          exit-code: '0'

      - name: Scan client Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'client/Dockerfile'
          format: 'table'
          exit-code: '0'

      - name: Scan AI service Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'ai-service/Dockerfile'
          format: 'table'
          exit-code: '0'

      - name: Post config scan summary
        if: always()
        run: |
          echo "## Dockerfile Configuration Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trivy checked all Dockerfiles for misconfigurations:" >> $GITHUB_STEP_SUMMARY
          echo "- Running containers as root user" >> $GITHUB_STEP_SUMMARY
          echo "- Missing USER directive" >> $GITHUB_STEP_SUMMARY
          echo "- Exposing unnecessary ports" >> $GITHUB_STEP_SUMMARY
          echo "- Using latest tag instead of pinned versions" >> $GITHUB_STEP_SUMMARY
          echo "- Missing HEALTHCHECK instructions" >> $GITHUB_STEP_SUMMARY