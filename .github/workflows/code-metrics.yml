#AI Usage log:
# Tool: ChatGPT 
# All code is AI generated and human verified
name: Code metrics

on:
  push:
    branches: [metrics/ci-tracking]

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ── 1. Lines of code ──────────────────────────────
      - name: Count lines of code (cloc)
        run: |
          sudo apt-get install -y cloc
          cloc client/src/ \
            --exclude-dir=node_modules,dist,coverage \
            --json --out=cloc-report.json
          echo "=== LOC SUMMARY ==="
          python3 << 'EOF'
import json
with open('cloc-report.json') as f:
    data = json.load(f)
t = data.get('SUM', {})
print('Files   :', t.get('nFiles', 0))
print('Code    :', t.get('code', 0))
print('Comment :', t.get('comment', 0))
EOF
          "

      # ── 2. File / class / method count ────────────────
      - name: Count symbols (babel)
        run: |
          npm install @babel/parser estree-walker --no-save
          node scripts/count-symbols.mjs

      # ── 3. Cyclomatic complexity ───────────────────────
      - name: Cyclomatic complexity (ESLint)
        run: |
          npx eslint client/src/ \
            --rule '{"complexity":["warn",{"max":10}]}' \
            --format stylish \
            --ext .js,.jsx \
            || true

      # ── Upload reports ─────────────────────────────────
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-metrics
          path: cloc-report.json