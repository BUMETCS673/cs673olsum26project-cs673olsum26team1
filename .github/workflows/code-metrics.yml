#AI Usage log:
# Tool: ChatGPT 
# All code is AI generated and human verified
name: Code metrics

on:
  push:
    branches: [metrics/kai-ci-tracking]

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Count lines of code (cloc)
        run: |
          sudo apt-get install -y cloc
          cloc client/src/ \
            --exclude-dir=node_modules,dist,coverage \
            --json --out=cloc-report.json
          echo "=== LOC SUMMARY ==="
          echo "import json" > parse_cloc.py
          echo "with open('cloc-report.json') as f:" >> parse_cloc.py
          echo "    data = json.load(f)" >> parse_cloc.py
          echo "t = data.get('SUM', {})" >> parse_cloc.py
          echo "print('Files   :', t.get('nFiles', 0))" >> parse_cloc.py
          echo "print('Code    :', t.get('code', 0))" >> parse_cloc.py
          echo "print('Comment :', t.get('comment', 0))" >> parse_cloc.py
          python3 parse_cloc.py

      - name: Count symbols (babel)
        run: |
          npm install @babel/parser estree-walker --no-save
          node scripts/count-symbols.mjs

      - name: Cyclomatic complexity (ESLint)
        run: |
          npx eslint client/src/ \
            --rule '{"complexity":["warn",{"max":10}]}' \
            --format stylish \
            --ext .js,.jsx \
            || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-metrics
          path: cloc-report.json