# CI Pipeline — BariatricPath
# Runs tests for all three services on every push and PR
# Foundation of the pipeline — everything else builds on top of this
#
# AI-USAGE SUMMARY
# Tools: Claude, ChatGPT
# Overall AI Contribution: ~45%
# AI-Assisted Areas: workflow structure, caching, env variables
# Human Contributions: project paths, test commands, stack decisions
# Notes: covers Node (Jest), React (Vitest), Python (pytest)

name: BariatricPath — CI Tests and Linting

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  server-tests:
    name: Server Tests (Jest + Supertest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run Jest tests
        working-directory: server
        run: npm test
