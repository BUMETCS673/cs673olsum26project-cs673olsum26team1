# CI Pipeline — BariatricPath
# Runs tests for all three services on every push and PR
# Foundation of the pipeline — everything else builds on top of this
#
# AI-USAGE SUMMARY
# Tools: Claude, ChatGPT
# Overall AI Contribution: ~45%
# AI-Assisted Areas: workflow structure, caching, env variables
# Human Contributions: project paths, test commands, stack decisions
# Notes: covers Node (Jest), React (Vitest), Python (pytest)

name: CI — Tests and Linting

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:

  # ── SERVER TESTS ─────────────────────────────────────────────
  server-tests:
    name: Server Tests (Jest + Supertest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run Jest tests
        working-directory: server
        run: npm test
        env:
          NODE_ENV: test
          # Fake values — tests mock Firebase and Prisma
          # No real DB or Firebase connection is made
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          FIREBASE_PROJECT_ID: fake-project
          FIREBASE_CLIENT_EMAIL: fake@fake.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nfake\n-----END PRIVATE KEY-----\n"

      - name: Post test summary
        if: always()
        run: |
          echo "##  Server Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Jest + Supertest suite executed for Express routes" >> $GITHUB_STEP_SUMMARY
          echo "Covers: auth, patients, notifications, AI proxy route" >> $GITHUB_STEP_SUMMARY

  # ── CLIENT TESTS ─────────────────────────────────────────────
  client-tests:
    name: Client Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run Vitest
        working-directory: client
        run: npm test
        env:
          VITE_API_URL: http://localhost:5001/api

      - name: Post test summary
        if: always()
        run: |
          echo "## 🎨 Client Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Vitest suite executed for React components" >> $GITHUB_STEP_SUMMARY
          echo "Covers: PatientPortal, StatusBadge, AIChatWidget" >> $GITHUB_STEP_SUMMARY

  # ── AI SERVICE TESTS ──────────────────────────────────────────
  ai-service-tests:
    name: AI Service Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: ai-service
        run: pytest -v
        env:
          # Fake key — tests mock OpenAI, no API credits consumed
          OPENAI_API_KEY: fake-key-for-testing

      - name: Post test summary
        if: always()
        run: |
          echo "## AI Service Test Results" >> $GITHUB_STEP_SUMMARY
          echo "pytest suite executed for FastAPI endpoints" >> $GITHUB_STEP_SUMMARY
          echo "Covers: health, chat endpoint, all roles, validation, errors" >> $GITHUB_STEP_SUMMARY

  # ── ESLINT ────────────────────────────────────────────────────
  lint:
    name: ESLint Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run ESLint
        working-directory: client
        run: npm run lint
        continue-on-error: true
        # continue-on-error so lint warnings don't block the team

      - name: Post lint summary
        if: always()
        run: |
          echo "##  ESLint Results" >> $GITHUB_STEP_SUMMARY
          echo "ESLint executed on client React/JSX source" >> $GITHUB_STEP_SUMMARY

  # ── NPM AUDIT ─────────────────────────────────────────────────
  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit server dependencies
        working-directory: server
        run: |
          npm ci
          echo "## Server Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=high >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Audit client dependencies
        working-directory: client
        run: |
          npm ci
          echo "##  Client Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=high >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true