  client-tests:
    name: Client Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run Vitest
        working-directory: client
        run: npm test
        env:
          VITE_API_URL: http://localhost:5001/api

      - name: Post client test summary
        if: always()
        run: |
          echo "## Client Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Vitest suite executed for React components" >> $GITHUB_STEP_SUMMARY
          echo "Covers: PatientPortal, StatusBadge, AIChatWidget" >> $GITHUB_STEP_SUMMARY

  ai-service-tests:
    name: AI Service Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: ai-service
        run: pytest -v
        env:
          OPENAI_API_KEY: fake-key-for-testing

      - name: Post AI service test summary
        if: always()
        run: |
          echo "## AI Service Test Results" >> $GITHUB_STEP_SUMMARY
          echo "pytest suite executed for FastAPI endpoints" >> $GITHUB_STEP_SUMMARY
          echo "Covers: health, chat endpoint, all roles, validation, errors" >> $GITHUB_STEP_SUMMARY

  lint:
    name: ESLint Code Quality
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run ESLint
        working-directory: client
        run: npm run lint || true
        continue-on-error: true

      - name: Post lint summary
        if: always()
        run: |
          echo "## ESLint Results" >> $GITHUB_STEP_SUMMARY
          echo "ESLint executed on client React/JSX source" >> $GITHUB_STEP_SUMMARY

  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit server dependencies
        working-directory: server
        run: |
          npm ci
          echo "## Server Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=high >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Audit client dependencies
        working-directory: client
        run: |
          npm ci
          echo "## Client Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=high >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY